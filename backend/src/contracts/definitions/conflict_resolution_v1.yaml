name: conflict_resolution_v1
version: "1.0"
module: ConflictResolutionAgent
description: "Output contract for the conflict resolution agent"
fields:
  resolution_id:
    type: string
    required: true
    regex: "^RES-[A-Z0-9]{8}$"
  resolved_at:
    type: string
    required: true
  resolutions:
    type: array
    required: true
    items:
      type: object
      properties:
        contradiction_id:
          type: string
          required: true
        resolutionMethod:
          type: string
          required: true
          enum: [credibility_weighted, recency_weighted, weighted_average, investigation_required]
        resolved_value:
          type: string
          required: true
        confidence:
          type: number
          required: true
          min: 0
          max: 1
  investigation_paths:
    type: array
    required: true
semantic_checks:
  - "investigation_required resolutionMethod must produce a corresponding entry in investigation_paths"
  - "Each resolution must reference a contradiction_id from the input contradictions"
